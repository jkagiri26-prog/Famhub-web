name: FAMHUB Deploy to Cloudflare Pages
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # ── Flutter SDK Cache ──
      - name: Cache Flutter SDK
        id: cache-flutter
        uses: actions/cache@v3
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-stable-3.38.8-${{ hashFiles('pubspec.lock') }}

      # ── Flutter Setup (with SDK caching) ──
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.8'
          cache: true

      # ── Pub Dependency Cache ──
      - name: Cache Pub Dependencies
        id: cache-pub
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-

      # ── Get Dependencies (only if cache miss) ──
      - name: Get Dependencies
        if: steps.cache-pub.outputs.cache-hit != 'true'
        run: flutter pub get

      # ── Production Build (skips pub if already fetched) ──
      # ⚠️ TEMPORARY (Phase 2D) — the trailing AI_GATEWAY_DEV_PROBE line
      #    below was added ONLY for the Phase 2D live test.
      #    REVERT IT after testing: delete the last --dart-define line and
      #    this comment. Nothing else in this workflow changed.
      - name: Build Web (WASM)
        run: flutter build web --release --wasm --base-href / --source-maps=false --no-pub --no-tree-shake-icons \
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
          --dart-define=AI_GATEWAY_DEV_PROBE=true
      # ── Deploy to Cloudflare Pages ──
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=famhub --branch=main

