<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <title>Vunio</title>
  <meta name="theme-color" content="#256D3A">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#256D3A">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B5229">
  <link rel="manifest" href="manifest.json?v=20261120e">
  <style>
    body { background-color: #F3F7F0; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
    .loader { border: 5px solid #f3f3f3; border-top: 5px solid #256D3A; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="loader"></div>
    <p style="color: #256D3A; margin-top: 15px;">Loading Vunio...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
