  <script>
    (function () {
      'use strict';

      var STATE_LOADING = 'loading';
      var STATE_READY = 'ready';
      var STATE_ERROR = 'error';
      var STARTUP_TIMEOUT_MS = 30000;

      var state = STATE_LOADING;
      var timeoutId = null;
      var firstFrameSeen = false;
      var loadingElement = null;
      var errorElement = null;
      var retryButton = null;

      function setState(nextState) {
        state = nextState;
        document.documentElement.setAttribute('data-vunio-startup', nextState);
      }

      function clearStartupTimeout() {
        if (timeoutId !== null) {
          window.clearTimeout(timeoutId);
          timeoutId = null;
        }
      }

      function startStartupTimeout() {
        clearStartupTimeout();
        timeoutId = window.setTimeout(function () {
          timeoutId = null;
          if (state === STATE_LOADING && !firstFrameSeen) {
            showError();
          }
        }, STARTUP_TIMEOUT_MS);
      }

      function showError() {
        if (state === STATE_READY || firstFrameSeen) {
          return;
        }
        clearStartupTimeout();
        setState(STATE_ERROR);
        if (loadingElement) {
          loadingElement.hidden = true;
        }
        if (errorElement) {
          errorElement.hidden = false;
        }
      }

      function failStartup() {
        if (state === STATE_READY || firstFrameSeen) {
          return;
        }
        showError();
      }

      function markReady() {
        if (firstFrameSeen) {
          return;
        }
        firstFrameSeen = true;
        clearStartupTimeout();
        setState(STATE_READY);
        if (loadingElement) {
          loadingElement.hidden = true;
          loadingElement.setAttribute('aria-busy', 'false');
        }
        if (errorElement) {
          errorElement.hidden = true;
        }
        window.removeEventListener('flutter-first-frame', markReady);
        window.removeEventListener('error', onWindowError, true);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      }

      function onWindowError(event) {
        if (state !== STATE_LOADING) {
          return;
        }
        var target = event && event.target;
        if (target && target.tagName === 'SCRIPT') {
          var source = target.src || '';
          if (source.indexOf('flutter_bootstrap.js') !== -1 || source.indexOf('main.dart.js') !== -1) {
            failStartup();
          }
          return;
        }
        var filename = (event && event.filename) || '';
        if (filename.indexOf('flutter_bootstrap.js') !== -1 || filename.indexOf('main.dart.js') !== -1) {
          failStartup();
        }
      }

      function onUnhandledRejection() {
        if (state !== STATE_LOADING) {
          return;
        }
        failStartup();
      }

      function retryStartup() {
        if (state === STATE_READY) {
          return;
        }
        clearStartupTimeout();
        setState(STATE_LOADING);
        if (loadingElement) {
          loadingElement.hidden = false;
          loadingElement.setAttribute('aria-busy', 'true');
        }
        if (errorElement) {
          errorElement.hidden = true;
        }
        if (retryButton) {
          retryButton.disabled = true;
        }
        window.setTimeout(function () {
          window.location.reload();
        }, 50);
      }

      function initializeStartupState() {
        loadingElement = document.getElementById('loading');
        errorElement = document.getElementById('startup-error');
        retryButton = document.getElementById('startup-retry');

        if (retryButton) {
          retryButton.addEventListener('click', retryStartup);
        }

        window.addEventListener('flutter-first-frame', markReady);
        window.addEventListener('error', onWindowError, true);
        window.addEventListener('unhandledrejection', onUnhandledRejection);

        setState(STATE_LOADING);
        startStartupTimeout();
      }

      window.__vunioStartupFailure = failStartup;
      initializeStartupState();
    })();
