<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FamHub - Agricultural Operating System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FamHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FamHub</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { background-color: #f8f9fa; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #loading { text-align: center; }
    .loader { border: 5px solid #e0e0e0; border-top: 5px solid #2E7D32; border-radius: 50%; width: 44px; height: 44px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { color: #2E7D32; margin-top: 20px; font-weight: 400; }
    p { color: #757575; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <h2>FamHub</h2>
    <p>Loading...</p>
  </div>
  <script>
    // Remove loading indicator once Flutter boots
    window.addEventListener('load', function() {
      setTimeout(function() {
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }, 100);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
