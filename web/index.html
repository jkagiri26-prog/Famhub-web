<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vunio - Agricultural Operating System">
  <meta name="theme-color" content="#256D3A">
  <link rel="canonical" href="https://vunio.co.ke/">
  <meta property="og:site_name" content="Vunio">
  <meta property="og:url" content="https://vunio.co.ke/">
  <meta property="og:title" content="Vunio">
  <meta property="og:description" content="Vunio - Agricultural Operating System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vunio">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261120b">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=20261120b">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=20261120b">
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png?v=20261120b">
  <link rel="icon" href="favicon.ico?v=20261120b" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=20261120b">

  <title>Vunio</title>
  <link rel="manifest" href="site.webmanifest?v=20261120b">

  <style>
    body { background-color: #f8f9fa; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #loading { text-align: center; }
    .brand-logo { display: block; width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%; box-shadow: 0 10px 28px rgba(37, 109, 58, 0.18); }
    .loader { border: 5px solid #e0e0e0; border-top: 5px solid #256D3A; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 18px auto 0; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { color: #2E7D32; margin-top: 20px; font-weight: 400; }
    p { color: #757575; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loading">
    <img class="brand-logo" src="android-chrome-192x192.png?v=20261120b" alt="Vunio logo">
    <h2>Vunio</h2>
    <div class="loader"></div>
    <p>Loading...</p>
  </div>
  <script>
    // Remove loading indicator once Flutter boots
    window.addEventListener('load', function() {
      setTimeout(function() {
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }, 100);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
