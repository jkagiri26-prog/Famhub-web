name: famhub_app
description: A new Flutter project for FamHub
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend & Real-time
  supabase_flutter: ^2.12.0

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod: ^3.3.2

  # Routing
  go_router: ^14.8.0

  # UI Components & Data Visualization
  fl_chart: ^0.66.0

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location Services
  geolocator: ^13.0.1

  # Network & Connectivity
  connectivity_plus: ^7.0.0

  # Shared Widgets Dependencies
  cached_network_image: ^3.4.1

  # Missing dependencies - added to fix import errors
  flutter_local_notifications: ^18.0.1
  http: ^1.2.2
  path: ^1.9.1
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/images/farm1.png
    - assets/images/farm2.png
    - assets/images/farm3.png
    - assets/images/hero_image.png
    - assets/images/maize.png
    - assets/images/melon.png
    - assets/images/tomatoes.png


